<div class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Main Card Container -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
      
      <!-- Brand / Header -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 text-cyan-400 mb-2">
          <!-- Shield/Anchor Icon -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
        <p class="text-sm text-slate-400">Enter your credentials to access your account</p>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-4">
        
        <!-- Email Input -->
        <div>
          <label for="Username" class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
          <input 
            type="text" 
            formControlName="username"
            id="Username" 
            name="Username" 
            required 
            placeholder="Username"
            class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
          />
        </div>

        <!-- Password Input -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
            <a href="#" class="text-xs text-cyan-400 hover:text-cyan-300 font-medium transition-colors">Forgot password?</a>
          </div>
          <input 
            type="password" 
            formControlName="passwordHash"
            id="passwordHash" 
            name="passwordHash" 
            required 
            placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
          />
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="remember" 
            class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-cyan-500 focus:ring-cyan-500 focus:ring-offset-slate-900"
          />
          <label for="remember" class="ml-2 text-sm text-slate-400">Remember this device</label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold shadow-lg shadow-cyan-950/50 hover:shadow-cyan-900/50 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all"
        >
          Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="relative flex items-center justify-center">
        <div class="border-t border-slate-800 w-full"></div>
        <span class="bg-slate-900 px-3 text-xs text-slate-500 uppercase tracking-wider absolute">Or continue with</span>
      </div>

      <!-- Social Login Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button type="button" class="flex items-center justify-center gap-2 py-2 px-4 rounded-lg bg-slate-950 border border-slate-800 hover:bg-slate-800/50 text-sm font-medium text-slate-300 transition-colors">
          <!-- Google SVG -->
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972-3.332 0-6.033-2.701-6.033-6.032s2.701-6.032 6.033-6.032c1.498 0 2.866.549 3.921 1.453l2.814-2.814C17.503 2.988 15.139 2 12.545 2 7.021 2 2.545 6.477 2.545 12s4.476 10 10 10c5.783 0 9.602-4.068 9.602-9.766 0-.663-.062-1.31-.176-1.995h-9.426z"/>
          </svg>
          Google
        </button>
        <button type="button" class="flex items-center justify-center gap-2 py-2 px-4 rounded-lg bg-slate-950 border border-slate-800 hover:bg-slate-800/50 text-sm font-medium text-slate-300 transition-colors">
          <!-- GitHub SVG -->
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          GitHub
        </button>
      </div>

      <!-- Footer Signup Link -->
      <p class="text-center text-xs text-slate-400">
        Don't have an account? 
        <a href="#" class="text-cyan-400 hover:text-cyan-300 font-medium transition-colors">Sign up</a>
      </p>

    </div>
  </div>

</div>
