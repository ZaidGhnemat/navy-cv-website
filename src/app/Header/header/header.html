<!-- 1. Navigation -->
    <nav [ngClass]="isScrolled ? 'shadow-lg bg-navy-900' : 'bg-navy-900/95'" class="fixed w-full z-40 bg-navy-900 backdrop-blur-sm border-b border-slate-700 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" onclick="window.scrollTo(0,0)">
                    <i class="fa-solid fa-anchor text-gold-500 text-2xl"></i>
                    <span class="font-bold text-xl text-white tracking-wide">NAVFUTURE</span>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8 items-center">
                    <a routerLink="about" class="text-slate-300 hover:text-gold-500 transition-colors text-sm font-medium">About</a>
                    <a routerLink="navyLife" class="text-slate-300 hover:text-gold-500 transition-colors text-sm font-medium">Life in Navy</a>
                    <a routerLink="EligibilityRequirements" class="text-slate-300 hover:text-gold-500 transition-colors text-sm font-medium">Requirements</a>
                    <a routerLink="faq" class="text-slate-300 hover:text-gold-500 transition-colors text-sm font-medium">FAQ</a>
                    <a href="#contact" class="text-slate-300 hover:text-gold-500 transition-colors text-sm font-medium">Contact</a>
                    <a routerLink="form" class="bg-gold-500 hover:bg-gold-600 text-navy-900 font-bold py-2 px-5 rounded transition-all shadow-lg hover:shadow-gold-500/20 transform hover:-translate-y-0.5">
                        Apply Now
                    </a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button (click)="toggleMenu()" id="mobile-menu-btn" class="text-slate-300 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu (Hidden by default) -->
        <div *ngIf="isMenuOpen" id="mobile-menu" class="md:hidden bg-navy-900 border-t border-slate-700">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="#about" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800">About</a>
                <a href="#life" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800">Life in Navy</a>
                <a href="#requirements" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800">Requirements</a>
                <a href="#apply" class="block px-3 py-2 mt-4 text-center rounded-md text-base font-bold bg-gold-500 text-navy-900">Apply Now</a>
            </div>
        </div>
    </nav>
